spring:
  application:
    name: kasa
  datasource:
    url: ${KASA_DB_URL:jdbc:postgresql://localhost:5432/kasa}
    username: ${KASA_DB_APP_USER:kasa_app}
    password: ${KASA_DB_APP_PASSWORD:kasa_app}
  # One thread per job, so a long settlement run cannot hold up webhook delivery or recovery.
  task:
    scheduling:
      pool:
        size: 5
  # Migrations run as the schema owner; the application itself connects as a restricted role.
  flyway:
    user: ${KASA_DB_OWNER_USER:kasa}
    password: ${KASA_DB_OWNER_PASSWORD:kasa}

kasa:
  jwt:
    secret: ${KASA_JWT_SECRET}
    ttl: 1h
  payments:
    fee-basis-points: 250
    recovery-interval: PT30S
    # Longer than any bank call can take, so the job never races a request that is still in flight.
    recovery-stale-after: PT1M
  webhooks:
    dispatch-interval: PT5S
    batch-size: 50
    max-attempts: 8
    connect-timeout: PT3S
    request-timeout: PT5S
    # Longer than the slowest possible send, so a delivery is not re-claimed while still in flight.
    lease: PT1M
    base-backoff: PT30S
    max-backoff: PT1H
    # Local development only: permits http and private addresses as webhook targets.
    allow-insecure-targets: false
  settlement:
    # Daily, in UTC. Funds become payable once this long has passed since the start of today.
    cron: "0 0 2 * * *"
    delay: P1D
    recovery-interval: PT30S
    recovery-stale-after: PT1M
  reconciliation:
    # Daily, in UTC: compares yesterday's bank statement with our records.
    cron: "0 0 3 * * *"
  admin:
    # The platform operator's API. With no token set, the admin API rejects every request.
    token: ${KASA_ADMIN_TOKEN:}
  rate-limit:
    window: PT1M
    login-per-ip-and-email: 5
    login-per-ip: 30
    register-per-ip: 10
    checkout-pay-per-ip: 30
    payment-link-session-per-ip: 20
    password-reset-per-ip: 5
  encryption:
    # Protects secrets the application must read back. Without it a key is derived from the JWT secret.
    key: ${KASA_ENCRYPTION_KEY:}
  # Links in emails are built from this, never from the request's Host header.
  public-url: ${KASA_PUBLIC_URL:http://localhost:8080}
  mail:
    # No email provider is connected. A reset link in a log works as a password, so this stays off in production.
    log-body: ${KASA_MAIL_LOG_BODY:false}
  disputes:
    # Charged only when the merchant loses, in minor units.
    loss-fee: 15000
    response-window: P7D
    # How long the simulated bank takes to decide. A real one takes weeks, which no demo would survive.
    review-time: PT2M
    job-interval: PT30S
  billing:
    # Waits after the first, second and third failed attempt. The fourth failure ends the subscription.
    retry-delays: P1D,P3D,P5D
    # Longer than any charge can take, so a job never takes over an attempt that is still running.
    lease: PT2M
    job-interval: PT30S
  metrics:
    refresh-interval: PT15S

server:
  # Hosting platforms choose the port through this variable.
  port: ${PORT:8080}
  # Set to "native" behind a trusted reverse proxy, or every client appears to share the proxy's address.
  forward-headers-strategy: ${KASA_FORWARD_HEADERS:none}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
