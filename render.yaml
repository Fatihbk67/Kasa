services:
  - type: web
    name: kasa
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      # The database lives on Neon. Render asks for these once, when the service is created.
      - key: KASA_DB_URL
        sync: false
      - key: KASA_DB_APP_PASSWORD
        sync: false
      - key: KASA_DB_OWNER_USER
        sync: false
      - key: KASA_DB_OWNER_PASSWORD
        sync: false
      - key: KASA_DB_APP_USER
        value: kasa_app
      - key: KASA_JWT_SECRET
        generateValue: true
      - key: KASA_ADMIN_TOKEN
        generateValue: true
      - key: KASA_ENCRYPTION_KEY
        generateValue: true
      - key: KASA_PUBLIC_URL
        value: https://kasa-rpb3.onrender.com
      - key: KASA_FORWARD_HEADERS
        value: native
      # Real email through Brevo. All three are entered by hand in Render; until KASA_MAIL_PROVIDER is set to
      # "brevo", mail stays in the log and the site keeps running without a key.
      - key: KASA_MAIL_PROVIDER
        sync: false
      - key: KASA_BREVO_API_KEY
        sync: false
      - key: KASA_MAIL_FROM
        sync: false
      # iyzico sandbox keys, entered by hand. Without them the checkout page offers only the simulated bank.
      - key: KASA_IYZICO_API_KEY
        sync: false
      - key: KASA_IYZICO_SECRET_KEY
        sync: false
      # Google's public OAuth client id for "Sign in with Google". Without it the button is not shown.
      - key: KASA_GOOGLE_CLIENT_ID
        sync: false
      # Fits the JVM into a small instance, trading peak speed for memory.
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx320m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
